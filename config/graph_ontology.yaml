# Graph Ontology Configuration
# This file defines the types and keywords for knowledge graph classification
# Edit this file to add new types or keywords without modifying code

# Relationship Types
relationship_types:
  # Causal relationships
  - name: "causes"
    description: "One entity causes another"
    
  - name: "correlates_with"
    description: "Statistical correlation between entities"
    
  - name: "inhibits"
    description: "One entity inhibits another"
    
  - name: "enhances"
    description: "One entity enhances another"
    
  - name: "supports"
    description: "Evidence or logical support"
    
  - name: "interacts_with"
    description: "General interaction"
    
  - name: "associated_with"
    description: "General association"
    
  # Functional relationships
  - name: "uses"
    description: "One entity uses another"
    
  - name: "implements"
    description: "Implementation relationship"
    
  - name: "defines"
    description: "Definition relationship"
    
  - name: "provides"
    description: "Provision relationship"
    
  - name: "requires"
    description: "Dependency relationship"
    
  - name: "enables"
    description: "Enablement relationship"
    
  - name: "creates"
    description: "Creation relationship"
    
  # Structural relationships
  - name: "belongs_to"
    description: "Membership relationship"
    
  - name: "part_of"
    description: "Component relationship"
    
  # Academic relationships
  - name: "authored_by"
    description: "Authorship relationship"
    
  - name: "published_in"
    description: "Publication venue"
    
  - name: "referenced_by"
    description: "Citation relationship"


